<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sito in Costruzione — Gabriele Lombardi srl</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=10">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background: var(--primary);
      color: var(--light);
      min-height: 100dvh;
      overflow-x: hidden;
    }
    .under-construction {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: clamp(20px, 6vw, 80px);
      isolation: isolate;
    }
    .under-construction .pattern {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .under-construction .pattern::before,
    .under-construction .pattern::after {
      content: '';
      position: absolute;
      inset: -25%;
      background-color: rgba(0, 0, 0, .35);
      -webkit-mask-image: url('img/LOGO_ALLBLACK.svg');
      mask-image: url('img/LOGO_ALLBLACK.svg');
      -webkit-mask-repeat: repeat;
      mask-repeat: repeat;
      -webkit-mask-size: 200px 200px;
      mask-size: 200px 200px;
      animation: pattern-pan 40s linear infinite;
    }
    .under-construction .pattern::after {
      background-color: rgba(0, 0, 0, .18);
      -webkit-mask-size: 320px 320px;
      animation: pattern-pan-reverse 62s linear infinite;
    }
    @keyframes pattern-pan {
      from { -webkit-mask-position: 0 0; mask-position: 0 0; }
      to { -webkit-mask-position: 420px 420px; mask-position: 420px 420px; }
    }
    @keyframes pattern-pan-reverse {
      from { -webkit-mask-position: 0 0; mask-position: 0 0; }
      to { -webkit-mask-position: -680px 340px; mask-position: -680px 340px; }
    }
    .uc-header {
      position: relative;
      z-index: 2;
      margin-bottom: clamp(20px, 6vw, 60px);
    }
    .uc-title {
      font-weight: 800;
      font-size: clamp(48px, 16vw, 220px);
      line-height: 0.9;
      letter-spacing: -4px;
      text-transform: none;
      text-align: left;
    }
    .uc-title-line { display: block; }
    .uc-card-wrap {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: clamp(-40px, -6vw, -20px);
      margin-bottom: clamp(30px, 8vw, 80px);
      perspective: 1500px;
    }
    .uc-card-tilt { transform: rotateX(4deg); transform-style: preserve-3d; }
    .uc-card {
      width: min(860px, 92vw);
      aspect-ratio: 1039 / 685;
      position: relative;
      transform-style: preserve-3d;
      animation: uc-card-spin 14s linear infinite;
    }
    .uc-card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--secondary);
      box-shadow: 0 40px 80px rgba(0,0,0,.5);
    }
    .uc-card-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .uc-card-face--back { transform: rotateY(180deg); }
    @keyframes uc-card-spin {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
    .uc-contacts {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(10px, 2vw, 18px);
      margin-top: auto;
    }
    .uc-contacts .contact-btn {
      width: clamp(56px, 8vw, 72px);
      height: clamp(56px, 8vw, 72px);
    }
    .uc-contacts .contact-btn svg {
      width: clamp(24px, 4vw, 30px);
      height: clamp(24px, 4vw, 30px);
    }
    @media (max-width: 720px) {
      .uc-title { letter-spacing: -2px; }
    }
  </style>
</head>
<body>
  <main class="under-construction">
    <div class="pattern" aria-hidden="true"></div>
    <header class="uc-header">
      <h1 class="uc-title">
        <span class="uc-title-line">Sito in</span>
        <span class="uc-title-line">Costruzione</span>
      </h1>
    </header>
    <section class="uc-card-wrap">
      <div class="uc-card-tilt">
        <div class="uc-card">
          <div class="uc-card-face">
            <img src="img/cardfront.svg" alt="Biglietto da visita fronte">
          </div>
          <div class="uc-card-face uc-card-face--back">
            <img src="img/cardback.svg" alt="Biglietto da visita retro">
          </div>
        </div>
      </div>
    </section>
    <nav class="uc-contacts">
      <a class="contact-btn" href="tel:+393463521090" aria-label="Telefono">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </a>
      <a class="contact-btn" href="https://wa.me/393463521090" target="_blank" rel="noopener" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.7 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20z"/><path d="M16.4 14.1c-.3-.1-1.5-.8-1.8-.9-.3-.1-.5-.1-.7.1-.2.3-.7.9-.8 1-.2.2-.3.2-.6.1a7.4 7.4 0 0 1-2.2-1.4 8.2 8.2 0 0 1-1.5-1.9c-.2-.3 0-.4.1-.6l.4-.5c.1-.2.2-.3.3-.5v-.5l-.8-2c-.2-.5-.4-.5-.6-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.2 3c.1.2 2.1 3.2 5 4.4.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
      </a>
      <a class="contact-btn" href="mailto:info@gabrielelombardisrl.com" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </a>
      <a class="contact-btn contact-btn--square" href="https://www.instagram.com/gabrielelombardi.srl/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
      </a>
      <a class="contact-btn contact-btn--square" href="https://www.facebook.com/gabrielelombardi.srl/" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
      </a>
    </nav>
  </main>
</body>
</html>
