<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startpage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Montserrat', system-ui, sans-serif;
      background: #003566;
      color: #f5f5f5;
      overflow: visible;
    }
    .bg-pattern {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-pattern::before {
      content: '';
      position: absolute;
      inset: -40%;
      background-image: url('https://lombardiadmin.github.io/gl_startpage/img/LOGO_ALLBLACK.svg');
      background-repeat: repeat;
      background-size: 160px 160px;
      opacity: 0.08;
      transform: rotate(-30deg);
      animation: pattern-scroll 80s linear infinite;
      filter: brightness(0);
    }
    @keyframes pattern-scroll {
      from { background-position: 0 0; }
      to { background-position: 320px 0; }
    }
    .container {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: clamp(20px, 4vw, 60px);
      height: 100dvh;
      padding: clamp(20px, 4vw, 60px);
      overflow: visible;
    }
    .left-col, .right-col {
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 3vw, 22px);
      overflow: visible;
      padding-right: 0;
    }
    
    .title-row {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: visible;
      padding-top: 20px;
    }
    .title-logo {
      width: clamp(60px, 10vw, 90px);
      height: clamp(60px, 10vw, 90px);
      margin-top: -10px;
      display: block;
    }
    .title {
      font-size: clamp(42px, 10vw, 90px);
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 0.9;
    }
    
    .time {
      font-size: clamp(48px, 14vw, 140px);
      font-weight: 700;
      letter-spacing: -4px;
      line-height: 0.9;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .time-seconds {
      font-size: clamp(24px, 7vw, 70px);
      color: #f67828;
      font-weight: 600;
    }
    
    .top-row {
      display: flex;
      align-items: center;
      gap: clamp(16px, 3vw, 24px);
      flex-wrap: wrap;
    }
    
    .weather-row {
      display: flex;
      align-items: stretch;
      gap: clamp(10px, 2vw, 14px);
      flex-wrap: wrap;
    }
    .weather-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid rgba(246,120,40,.6);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
      height: 72px;
      width: 180px;
      flex-shrink: 0;
    }
    .location-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
      height: 72px;
    }
    .location-card input {
      background: transparent;
      border: none;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      width: 140px;
      outline: none;
    }
    .location-card button {
      background: #f67828;
      border: none;
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 12px;
    }
    .alarm-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
      height: 72px;
    }
    .alarm-card input[type="time"] {
      background: transparent;
      border: none;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
    }
    .alarm-card button {
      background: #f67828;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
    }
    
    .weather-icon {
      width: 42px;
      height: 42px;
    }
    .weather-info {
      display: flex;
      flex-direction: column;
    }
    .weather-day {
      font-size: 12px;
      opacity: .8;
    }
    .weather-temp {
      font-size: 20px;
      font-weight: 700;
    }
    
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
      width: 100%;
      max-width: 100%;
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      outline: none;
    }
    .search-box button {
      background: transparent;
      border: none;
      color: #f5f5f5;
      cursor: pointer;
    }
    
    .links-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      color: #f5f5f5;
      text-align: center;
      padding: 10px 6px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid rgba(246,120,40,.6);
      border-radius: 12px;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
      min-height: 90px;
    }
    .link-item svg,
    .link-item img {
      width: 29px;
      height: 29px;
      border-radius: 4px;
    }
    .link-item:hover {
      border-color: #f67828;
      background: rgba(246,120,40,.25);
      transform: translateY(-2px);
    }
    .link-name {
      font-size: 11px;
      line-height: 1.2;
      max-width: 90px;
    }
    
    .notes-area {
      margin-top: 10px;
      width: 100%;
      flex: 1;
      min-height: 120px;
    }
    .notes-area textarea {
      width: 100%;
      height: 100%;
      min-height: 120px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 12px;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      padding: 10px 12px;
      resize: none;
      outline: none;
    }
    .calendar-card {
      flex: 1;
      height: 100%;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,.4);
    }
    .calendar-card iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    @media (max-width: 1100px) {
      .container { grid-template-columns: 1fr; overflow: visible; }
      html, body { overflow: visible; }
      .calendar-card { height: 400px; }
      .search-box { width: 100%; }
      .links-grid { grid-template-columns: repeat(2, 1fr); }
      .weather-row { gap: 8px; display: flex; flex-wrap: wrap; }
      .alarm-card { flex: 1 1 45%; }
      .location-card { flex: 1 1 45%; }
      .weather-card { flex: 1 1 45%; }
    }
  </style>
</head>

  <script>
    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('time-main').textContent = h + ':' + m;
      document.getElementById('time-sec').textContent = ':' + s;
    }
    setInterval(updateTime, 1000);
    updateTime();

    let alarmTime = null;
    let alarmTriggered = false;
    let alarmAudioCtx = null;
    function playAlarm() {
      try {
        if (!alarmAudioCtx) {
          alarmAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (alarmAudioCtx.state === 'suspended') {
          alarmAudioCtx.resume();
        }
        const ctx = alarmAudioCtx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 1.5);
      } catch(e) {
        try { new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=').play(); } catch(_) {}
      }
    }
    function setAlarm() {
      const val = document.getElementById('alarmTime').value;
      if (!val) return;
      alarmTime = val;
      alarmTriggered = false;
      document.getElementById('alarmStatus').textContent = 'Sveglia impostata per ' + val;
    }
    setInterval(() => {
      if (!alarmTime) return;
      const now = new Date();
      const cur = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      if (cur === alarmTime && !alarmTriggered) {
        alarmTriggered = true;
        playAlarm();
        alert('Sveglia!');
        document.getElementById('alarmStatus').textContent = 'Sveglia attivata';
      }
    }, 1000);

    let weatherLat = 43.9636;
    let weatherLon = 10.2097;
    
    async function updateLocation() {
      const loc = document.getElementById('locationInput').value || 'Pietrasanta';
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(loc)}&format=json&limit=1`);
        const data = await res.json();
        if (data[0]) {
          weatherLat = parseFloat(data[0].lat);
          weatherLon = parseFloat(data[0].lon);
          loadWeather();
        }
      } catch(e) {
        loadWeather();
      }
    }
    
    async function loadWeather() {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${weatherLat}&longitude=${weatherLon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe/Rome&forecast_days=2`);
        const data = await res.json();
        const codes = data.daily.weathercode;
        const max = data.daily.temperature_2m_max;
        document.getElementById('weather-today').textContent = Math.round(max[0]) + '°';
        document.getElementById('weather-tomorrow').textContent = Math.round(max[1]) + '°';
        const icons = {
          0: 'https://openweathermap.org/img/wn/01d@2x.png',1:'https://openweathermap.org/img/wn/01d@2x.png',2:'https://openweathermap.org/img/wn/02d@2x.png',3:'https://openweathermap.org/img/wn/03d@2x.png',
          45:'https://openweathermap.org/img/wn/50d@2x.png',48:'https://openweathermap.org/img/wn/50d@2x.png',
          51:'https://openweathermap.org/img/wn/09d@2x.png',53:'https://openweathermap.org/img/wn/09d@2x.png',55:'https://openweathermap.org/img/wn/09d@2x.png',
          61:'https://openweathermap.org/img/wn/10d@2x.png',63:'https://openweathermap.org/img/wn/10d@2x.png',65:'https://openweathermap.org/img/wn/10d@2x.png',
          71:'https://openweathermap.org/img/wn/13d@2x.png',73:'https://openweathermap.org/img/wn/13d@2x.png',75:'https://openweathermap.org/img/wn/13d@2x.png',
          80:'https://openweathermap.org/img/wn/09d@2x.png',81:'https://openweathermap.org/img/wn/09d@2x.png',82:'https://openweathermap.org/img/wn/09d@2x.png',
          95:'https://openweathermap.org/img/wn/11d@2x.png'
        };
        document.getElementById('weather-icon-today').src = icons[codes[0]] || icons[0];
        document.getElementById('weather-icon-tomorrow').src = icons[codes[1]] || icons[0];
      } catch(e) {}
    }
    loadWeather();

    // Custom links
    function loadCustomLinks() {
      try {
        const links = JSON.parse(localStorage.getItem('startpage-custom-links') || '[]');
        const grid = document.getElementById('linksGrid');
        const addBtn = grid.querySelector('button[onclick="addCustomLink()"]');
        links.slice(0, 16).forEach(link => {
          const a = document.createElement('a');
          a.className = 'link-item';
          a.href = link.url;
          a.target = '_blank';
          a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span class="link-name">' + (link.name || 'Link') + '</span>';
          grid.insertBefore(a, addBtn);
        });
      } catch(e) {}
    }

    function addCustomLink() {
      try {
        const links = JSON.parse(localStorage.getItem('startpage-custom-links') || '[]');
        if (links.length >= 16) {
          alert('Limite massimo di 16 link raggiunto.');
          return;
        }
        const name = prompt('Nome del link:');
        if (!name) return;
        let url = prompt('URL del link (includi https://):');
        if (!url) return;
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        links.push({ name, url });
        localStorage.setItem('startpage-custom-links', JSON.stringify(links));
        const grid = document.getElementById('linksGrid');
        const addBtn = grid.querySelector('button[onclick="addCustomLink()"]');
        const a = document.createElement('a');
        a.className = 'link-item';
        a.href = url;
        a.target = '_blank';
        a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span class="link-name">' + name + '</span>';
        grid.insertBefore(a, addBtn);
      } catch(e) {}
    }

    loadCustomLinks();

    const notes = document.getElementById('notes');
    if (notes) {
      notes.value = localStorage.getItem('startpage-notes') || '';
      notes.addEventListener('input', () => localStorage.setItem('startpage-notes', notes.value));
    }

    // Local calendar
    let calDate = new Date();
    function renderCalendar() {
      const grid = document.getElementById('calGrid');
      const title = document.getElementById('calTitle');
      if (!grid || !title) return;
      grid.innerHTML = '';
      const year = calDate.getFullYear();
      const month = calDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const monthNames = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
      title.textContent = monthNames[month] + ' ' + year;
      let start = firstDay.getDay();
      if (start === 0) start = 7;
      for (let i = 1; i < start; i++) {
        const empty = document.createElement('div');
        grid.appendChild(empty);
      }
      for (let d = 1; d <= lastDay.getDate(); d++) {
        const cellWrap = document.createElement('div');
        cellWrap.style.display = 'flex';
        cellWrap.style.flexDirection = 'column';
        cellWrap.style.minHeight = '40px';
        cellWrap.style.borderRadius = '6px';
        cellWrap.style.overflow = 'hidden';
        const dayNum = document.createElement('div');
        dayNum.textContent = d;
        dayNum.style.padding = '2px 4px';
        dayNum.style.fontSize = '10px';
        const today = new Date();
        if (today.getDate() === d && today.getMonth() === month && today.getFullYear() === year) {
          cellWrap.style.background = 'rgba(246,120,40,0.3)';
          dayNum.style.fontWeight = '600';
        }
        const note = document.createElement('div');
        note.contentEditable = true;
        note.setAttribute('data-date', year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0'));
        note.style.flex = '1';
        note.style.fontSize = '9px';
        note.style.padding = '2px 4px';
        note.style.outline = 'none';
        note.style.wordBreak = 'break-word';
        note.style.overflow = 'hidden';
        const key = 'cal-note-' + note.getAttribute('data-date');
        note.textContent = localStorage.getItem(key) || '';
        note.addEventListener('input', () => {
          if (note.textContent.length > 30) {
            note.textContent = note.textContent.substring(0, 30);
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(note);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
          }
          localStorage.setItem(key, note.textContent);
        });
        cellWrap.appendChild(dayNum);
        cellWrap.appendChild(note);
        grid.appendChild(cellWrap);
      }
    }
    function prevMonth() { calDate.setMonth(calDate.getMonth() - 1); renderCalendar(); }
    function nextMonth() { calDate.setMonth(calDate.getMonth() + 1); renderCalendar(); }
    renderCalendar();
  </script>
</body>
