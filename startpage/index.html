<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startpage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Montserrat', system-ui, sans-serif;
      background: #003566;
      color: #f5f5f5;
      overflow: hidden;
    }
    .bg-pattern {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-pattern::before {
      content: '';
      position: absolute;
      inset: -40%;
      background-image: url('https://lombardiadmin.github.io/gl_startpage/img/LOGO_ALLBLACK.svg');
      background-repeat: repeat;
      background-size: 160px 160px;
      opacity: 0.08;
      transform: rotate(-30deg);
      animation: pattern-scroll 80s linear infinite;
      filter: brightness(0);
    }
    @keyframes pattern-scroll {
      from { background-position: 0 0; }
      to { background-position: 320px 0; }
    }
    .container {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: clamp(20px, 4vw, 60px);
      height: 100dvh;
      padding: clamp(20px, 4vw, 60px);
      overflow: hidden;
    }
    .left-col, .right-col {
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 3vw, 28px);
      overflow-y: auto;
      padding-right: 8px;
    }
    .left-col::-webkit-scrollbar, .right-col::-webkit-scrollbar { width: 6px; }
    .left-col::-webkit-scrollbar-thumb, .right-col::-webkit-scrollbar-thumb { background: rgba(246,120,40,.6); border-radius: 6px; }
    .left-col::-webkit-scrollbar-track, .right-col::-webkit-scrollbar-track { background: transparent; }
    
    .title {
      font-size: clamp(42px, 10vw, 90px);
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 0.9;
    }
    
    .time-row {
      display: flex;
      align-items: center;
      gap: clamp(16px, 3vw, 28px);
      flex-wrap: wrap;
    }
    .time {
      font-size: clamp(48px, 14vw, 140px);
      font-weight: 700;
      letter-spacing: -4px;
      line-height: 0.9;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .time-seconds {
      font-size: clamp(24px, 7vw, 70px);
      color: #f67828;
      font-weight: 600;
    }
    .alarm-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    .alarm-card input[type="time"] {
      background: transparent;
      border: none;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
    }
    .alarm-card button {
      background: #f67828;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
    }
    
    .weather {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(12px, 2vw, 18px);
    }
    .weather-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid rgba(246,120,40,.6);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
    }
    .weather-icon {
      width: 48px;
      height: 48px;
    }
    .weather-info {
      display: flex;
      flex-direction: column;
    }
    .weather-day {
      font-size: 13px;
      opacity: .8;
    }
    .weather-temp {
      font-size: 22px;
      font-weight: 700;
    }
    
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      outline: none;
    }
    .search-box button {
      background: transparent;
      border: none;
      color: #f5f5f5;
      cursor: pointer;
    }
    
    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }
    .link-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: linear-gradient(145deg, rgba(0,53,102,.7), rgba(0,35,63,.4));
      border: 1px solid rgba(246,120,40,.5);
      border-radius: 12px;
      color: #f5f5f5;
      text-decoration: none;
      font-size: 14px;
      transition: transform .2s ease, border-color .2s ease;
    }
    .link-item:hover {
      transform: translateX(4px);
      border-color: #f67828;
    }
    
    .calendar-card {
      flex: 1;
      min-height: 400px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,.4);
    }
    .calendar-card iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    .notes-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px 18px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,.4);
    }
    .notes-card textarea {
      width: 100%;
      min-height: 160px;
      background: transparent;
      border: none;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      resize: vertical;
      outline: none;
    }
    
    @media (max-width: 1100px) {
      .container { grid-template-columns: 1fr; overflow-y: auto; }
      html, body { overflow: auto; }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="container">
    <div class="left-col">
      <h1 class="title">Startpage</h1>
      
      <div class="time-row">
        <div class="time">
          <span id="time-main">00:00</span>
          <span class="time-seconds" id="time-sec">:00</span>
        </div>
        <div class="alarm-card">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f67828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3L2 6"/><path d="M22 6l-3-3"/><path d="M6.38 18.7L4 21"/><path d="M17.64 18.67L20 21"/></svg>
          <input type="time" id="alarmTime">
          <button onclick="setAlarm()">Imposta</button>
          <span id="alarmStatus" style="font-size:12px; opacity:.8;"></span>
        </div>
      </div>
      
      <div class="weather">
        <div class="weather-card">
          <img class="weather-icon" id="weather-icon-today" src="" alt="">
          <div class="weather-info">
            <span class="weather-day">Oggi</span>
            <span class="weather-temp" id="weather-today">--°</span>
          </div>
        </div>
        <div class="weather-card">
          <img class="weather-icon" id="weather-icon-tomorrow" src="" alt="">
          <div class="weather-info">
            <span class="weather-day">Domani</span>
            <span class="weather-temp" id="weather-tomorrow">--°</span>
          </div>
        </div>
      </div>
      
      <form class="search-box" action="https://duckduckgo.com/" method="GET">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" name="q" placeholder="Cerca con DuckDuckGo..." autocomplete="off">
        <button type="submit">Cerca</button>
      </form>
      
      <div class="links">
        <a class="link-item" href="https://gabrielelombardisrl.com" target="_blank">Sito</a>
        <a class="link-item" href="https://webmail.gabrielelombardisrl.com" target="_blank">Webmail</a>
        <a class="link-item" href="https://www.namecheap.com" target="_blank">Namecheap</a>
        <a class="link-item" href="https://pec.legalmail.it" target="_blank">Legalmail PEC</a>
        <a class="link-item" href="https://namiral.it" target="_blank">Namiral PEC</a>
        <a class="link-item" href="https://mail.google.com" target="_blank">Gmail</a>
        <a class="link-item" href="https://www.fattureincloud.it" target="_blank">Fatture in cloud</a>
        <a class="link-item" href="https://drive.google.com/drive/folders/1b-_ltrPAFRr6zDzSw6Bn8rayREw6NcQG?usp=drive_link" target="_blank">Google Drive</a>
        <a class="link-item" href="https://github.com/lombardiadmin?tab=repositories" target="_blank">GitHub</a>
        <a class="link-item" href="https://www.facebook.com/gabrielelombardi.srl" target="_blank">Facebook (@gabrielelombardi.srl)</a>
        <a class="link-item" href="https://www.instagram.com/gabrielelombardi.srl/" target="_blank">Instagram (@gabrielelombardi.srl)</a>
      </div>
    </div>
    
    <div class="right-col">
      <div class="calendar-card">
        <iframe src="https://calendar.google.com/calendar/embed?src=gabrielelombardisrl%40gmail.com&ctz=Europe%2FRome&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=1&showCalendars=0&showTz=0" style="border: 0" frameborder="0" scrolling="no"></iframe>
      </div>
      <div class="notes-card">
        <div style="font-weight:600;">Note</div>
        <textarea id="notes" placeholder="Scrivi le tue note..."></textarea>
      </div>
    </div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('time-main').textContent = h + ':' + m;
      document.getElementById('time-sec').textContent = ':' + s;
    }
    setInterval(updateTime, 1000);
    updateTime();

    let alarmTime = null;
    let alarmTriggered = false;
    function setAlarm() {
      const val = document.getElementById('alarmTime').value;
      if (!val) return;
      alarmTime = val;
      alarmTriggered = false;
      document.getElementById('alarmStatus').textContent = 'Sveglia impostata per ' + val;
    }
    setInterval(() => {
      if (!alarmTime) return;
      const now = new Date();
      const cur = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      if (cur === alarmTime && !alarmTriggered) {
        alarmTriggered = true;
        alert('Sveglia!');
        document.getElementById('alarmStatus').textContent = 'Sveglia attivata';
      }
    }, 1000);

    async function loadWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=43.9636&longitude=10.2097&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe/Rome&forecast_days=2');
        const data = await res.json();
        const codes = data.daily.weathercode;
        const max = data.daily.temperature_2m_max;
        document.getElementById('weather-today').textContent = Math.round(max[0]) + '°';
        document.getElementById('weather-tomorrow').textContent = Math.round(max[1]) + '°';
        const icons = {
          0: 'https://openweathermap.org/img/wn/01d@2x.png',1:'https://openweathermap.org/img/wn/01d@2x.png',2:'https://openweathermap.org/img/wn/02d@2x.png',3:'https://openweathermap.org/img/wn/03d@2x.png',
          45:'https://openweathermap.org/img/wn/50d@2x.png',48:'https://openweathermap.org/img/wn/50d@2x.png',
          51:'https://openweathermap.org/img/wn/09d@2x.png',53:'https://openweathermap.org/img/wn/09d@2x.png',55:'https://openweathermap.org/img/wn/09d@2x.png',
          61:'https://openweathermap.org/img/wn/10d@2x.png',63:'https://openweathermap.org/img/wn/10d@2x.png',65:'https://openweathermap.org/img/wn/10d@2x.png',
          71:'https://openweathermap.org/img/wn/13d@2x.png',73:'https://openweathermap.org/img/wn/13d@2x.png',75:'https://openweathermap.org/img/wn/13d@2x.png',
          80:'https://openweathermap.org/img/wn/09d@2x.png',81:'https://openweathermap.org/img/wn/09d@2x.png',82:'https://openweathermap.org/img/wn/09d@2x.png',
          95:'https://openweathermap.org/img/wn/11d@2x.png'
        };
        document.getElementById('weather-icon-today').src = icons[codes[0]] || icons[0];
        document.getElementById('weather-icon-tomorrow').src = icons[codes[1]] || icons[0];
      } catch(e) {}
    }
    loadWeather();

    const notes = document.getElementById('notes');
    notes.value = localStorage.getItem('startpage-notes') || '';
    notes.addEventListener('input', () => localStorage.setItem('startpage-notes', notes.value));
  </script>
</body>
</html>
