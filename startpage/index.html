<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startpage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Montserrat', system-ui, sans-serif;
      background: #003566;
      color: #f5f5f5;
      overflow: visible;
    }
    .bg-pattern {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-pattern::before {
      content: '';
      position: absolute;
      inset: -40%;
      background-image: url('https://lombardiadmin.github.io/gl_startpage/img/LOGO_ALLBLACK.svg');
      background-repeat: repeat;
      background-size: 160px 160px;
      opacity: 0.08;
      transform: rotate(-30deg);
      animation: pattern-scroll 80s linear infinite;
      filter: brightness(0);
    }
    @keyframes pattern-scroll {
      from { background-position: 0 0; }
      to { background-position: 320px 0; }
    }
    .container {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: clamp(20px, 4vw, 60px);
      height: 100dvh;
      padding: clamp(20px, 4vw, 60px);
      overflow: visible;
    }
    .left-col, .right-col {
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 3vw, 22px);
      overflow: visible;
      padding-right: 0;
    }
    
    .title-row {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow: visible;
      padding-top: 20px;
    }
    .title-logo {
      width: clamp(60px, 10vw, 90px);
      height: clamp(60px, 10vw, 90px);
      margin-top: -10px;
      display: block;
    }
    .title {
      font-size: clamp(42px, 10vw, 90px);
      font-weight: 800;
      letter-spacing: -2.7px;
      line-height: 0.9;
    }
    
    .time {
      font-size: clamp(48px, 14vw, 140px);
      font-weight: 700;
      letter-spacing: -3.6px;
      line-height: 0.9;
      display: flex;
      align-items: baseline;
      gap: 10px;
      cursor: pointer;
    }
    .time-seconds {
      font-size: clamp(24px, 7vw, 70px);
      color: #f67828;
      font-weight: 600;
    }
    
    .top-row {
      display: flex;
      align-items: center;
      gap: clamp(16px, 3vw, 24px);
      flex-wrap: wrap;
    }
    
    .weather-row {
      display: flex;
      align-items: stretch;
      gap: clamp(10px, 2vw, 14px);
      flex-wrap: wrap;
    }
    .location-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
      min-height: 72px;
      flex-shrink: 0;
    }
    .location-card input {
      background: transparent;
      border: none;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      width: 120px;
      outline: none;
    }
    .weather-week-card {
      flex: 1;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid rgba(246,120,40,.6);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
      overflow-x: auto;
      min-height: 72px;
    }
    .weather-day-item {
      display: flex;
      align-items: center;
      min-width: 90px;
      flex: 1;
      font-size: 11px;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 8px;
    }
    .weather-day-item.today {
      background: rgba(246,120,40,0.25);
      border: 1px solid rgba(246,120,40,0.6);
    }
    .weather-day-item img {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
    }
    .weather-day-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
      width: 100%;
      max-width: 100%;
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      outline: none;
    }
    .search-box button {
      background: transparent;
      border: none;
      color: #f5f5f5;
      cursor: pointer;
    }
    
    .links-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      color: #f5f5f5;
      text-align: center;
      padding: 10px 6px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid rgba(246,120,40,.6);
      border-radius: 12px;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
      min-height: 90px;
      position: relative;
    }
    .link-item svg,
    .link-item img {
      width: 29px;
      height: 29px;
      border-radius: 4px;
    }
    .link-item:hover {
      border-color: #f67828;
      background: rgba(246,120,40,.25);
      transform: translateY(-2px);
    }
    .link-name {
      font-size: 11px;
      line-height: 1.2;
      max-width: 90px;
    }
    .link-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 50%;
      background: rgba(246,120,40,.8);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .link-item:hover .link-remove { display: flex; }
    .link-add {
      cursor: pointer;
    }
    
    .notes-area {
      margin-top: 10px;
      width: 100%;
      flex: 1;
      min-height: 120px;
    }
    .notes-area textarea {
      width: 100%;
      height: 100%;
      min-height: 120px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 12px;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      padding: 10px 12px;
      resize: none;
      outline: none;
    }
    .calendar-card {
      flex: 1;
      height: 100%;
      background: linear-gradient(145deg, rgba(0,20,45,.95), rgba(0,10,25,.9));
      border: 1px solid #f67828;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,.4);
    }
    .calendar-card iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    @media (min-width: 1101px) {
      .cal-note { font-size: 12px !important; }
    }
    @media (max-width: 1100px) {
      .container { grid-template-columns: 1fr; overflow: visible; }
      html, body { overflow: visible; }
      .calendar-card { height: 400px; }
      .search-box { width: 100%; }
      .links-grid { grid-template-columns: repeat(2, 1fr); }
      .weather-row { gap: 8px; flex-wrap: wrap; }
      .location-card { flex: 1 1 100%; }
      .weather-week-card { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="container">
    <div class="left-col">
      <div class="title-row">
        <img class="title-logo" src="https://lombardiadmin.github.io/gl_startpage/img/LOGOWHITE.svg" alt="Logo">
        <h1 class="title">Startpage</h1>
      </div>
      
      <div class="time" id="timeDisplay" title="Clicca per impostare la sveglia">
        <span id="time-main">00:00</span>
        <span class="time-seconds" id="time-sec">:00</span>
      </div>
      <div id="alarmStatus" style="font-size:12px; opacity:.8; min-height:16px;"></div>
      
      <div class="weather-row">
        <div class="location-card">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f67828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <input id="locationInput" value="Pietrasanta" placeholder="Località">
        </div>
        <div class="weather-week-card" id="weatherWeek">
          <div style="opacity:.8;">Caricamento meteo...</div>
        </div>
      </div>
      
      <form class="search-box" action="https://www.google.com/search" method="GET">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" name="q" placeholder="Cerca con Google..." autocomplete="off">
        <button type="submit">Cerca</button>
      </form>
      
      <div class="links-grid" id="linksGrid"></div>
      
      <div class="notes-area">
        <textarea id="notes" placeholder="Scrivi in modo costante e abbondante"></textarea>
      </div>
    </div>
    
    <div class="right-col">
      <div class="calendar-card" style="display:flex;flex-direction:column;padding:12px;gap:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <button onclick="prevMonth()" style="background:transparent;border:none;color:#f5f5f5;cursor:pointer;font-size:18px;">&#10094;</button>
          <div id="calTitle" style="font-weight:700;font-size:42px;"></div>
          <button onclick="nextMonth()" style="background:transparent;border:none;color:#f5f5f5;cursor:pointer;font-size:18px;">&#10095;</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:22px;color:#f67828;font-weight:700;border-bottom:1px solid rgba(246,120,40,.4);padding-bottom:6px;">
          <div>L</div><div>M</div><div>M</div><div>G</div><div>V</div><div>S</div><div>D</div>
        </div>
        <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:0;flex:1;border-top:1px solid rgba(255,255,255,.08);border-left:1px solid rgba(255,255,255,.08);"></div>
        <a href="https://calendar.google.com/calendar/u/0/r" target="_blank" style="text-align:center;color:#f5f5f5;text-decoration:none;background:#f67828;padding:8px;border-radius:8px;font-weight:600;">vai su Google Calendar</a>
      </div>
    </div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('time-main').textContent = h + ':' + m;
      document.getElementById('time-sec').textContent = ':' + s;
    }
    setInterval(updateTime, 1000);
    updateTime();

    let alarmTime = null;
    let alarmTriggered = false;
    let alarmAudioCtx = null;
    function playAlarm() {
      try {
        if (!alarmAudioCtx) {
          alarmAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (alarmAudioCtx.state === 'suspended') {
          alarmAudioCtx.resume();
        }
        const ctx = alarmAudioCtx;
        const now = ctx.currentTime;
        const freqs = [880, 988, 1047, 988, 880, 988, 1047, 988, 880, 988, 1047, 988];
        freqs.forEach((f, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = f;
          osc.type = 'sine';
          const t = now + i * 0.3;
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
          osc.start(t);
          osc.stop(t + 0.29);
        });
      } catch(e) {}
    }
    function setAlarmByClick() {
      const val = prompt('Imposta sveglia (HH.MM) — lascia vuoto per rimuovere:', alarmTime || '');
      if (val === null) return;
      if (val === '') {
        alarmTime = null;
        alarmTriggered = false;
        localStorage.removeItem('startpage-alarm');
        document.getElementById('alarmStatus').textContent = '';
        return;
      }
      if (!/^\d{2}\.\d{2}$/.test(val)) {
        alert('Formato non valido. Usa HH.MM');
        return;
      }
      alarmTime = val;
      alarmTriggered = false;
      localStorage.setItem('startpage-alarm', val);
      document.getElementById('alarmStatus').textContent = 'Sveglia: ' + val;
    }
    document.getElementById('timeDisplay').addEventListener('click', setAlarmByClick);
    const savedAlarm = localStorage.getItem('startpage-alarm');
    if (savedAlarm) { alarmTime = savedAlarm; document.getElementById('alarmStatus').textContent = 'Sveglia: ' + savedAlarm; }
    setInterval(() => {
      if (!alarmTime) return;
      const now = new Date();
      const cur = String(now.getHours()).padStart(2,'0') + '.' + String(now.getMinutes()).padStart(2,'0');
      if (cur === alarmTime && !alarmTriggered) {
        alarmTriggered = true;
        playAlarm();
        alert('!!SVEGLIA!!');
        document.getElementById('alarmStatus').textContent = 'Sveglia attivata';
      }
    }, 1000);

    let weatherLat = 43.9636;
    let weatherLon = 10.2097;
    
    async function updateLocation() {
      const loc = document.getElementById('locationInput').value || 'Pietrasanta';
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(loc)}&format=json&limit=1`);
        const data = await res.json();
        if (data[0]) {
          weatherLat = parseFloat(data[0].lat);
          weatherLon = parseFloat(data[0].lon);
          localStorage.setItem('startpage-location', JSON.stringify({ name: loc, lat: weatherLat, lon: weatherLon }));
          loadWeather();
        }
      } catch(e) {
        loadWeather();
      }
    }
    const savedLoc = localStorage.getItem('startpage-location');
    if (savedLoc) {
      try {
        const sl = JSON.parse(savedLoc);
        if (sl.lat && sl.lon) { weatherLat = sl.lat; weatherLon = sl.lon; document.getElementById('locationInput').value = sl.name || 'Pietrasanta'; }
      } catch(e) {}
    }
    const locInput = document.getElementById('locationInput');
    if (locInput) {
      locInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); updateLocation(); }
      });
    }

    async function loadWeather() {
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${weatherLat}&longitude=${weatherLon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe/Rome&forecast_days=7`);
        const data = await res.json();
        const codes = data.daily.weathercode || [];
        const max = data.daily.temperature_2m_max || [];
        const dates = data.daily.time || [];
        const icons = {
          0: 'https://openweathermap.org/img/wn/01d@2x.png',1:'https://openweathermap.org/img/wn/01d@2x.png',2:'https://openweathermap.org/img/wn/02d@2x.png',3:'https://openweathermap.org/img/wn/03d@2x.png',
          45:'https://openweathermap.org/img/wn/50d@2x.png',48:'https://openweathermap.org/img/wn/50d@2x.png',
          51:'https://openweathermap.org/img/wn/09d@2x.png',53:'https://openweathermap.org/img/wn/09d@2x.png',55:'https://openweathermap.org/img/wn/09d@2x.png',
          61:'https://openweathermap.org/img/wn/10d@2x.png',63:'https://openweathermap.org/img/wn/10d@2x.png',65:'https://openweathermap.org/img/wn/10d@2x.png',
          71:'https://openweathermap.org/img/wn/13d@2x.png',73:'https://openweathermap.org/img/wn/13d@2x.png',75:'https://openweathermap.org/img/wn/13d@2x.png',
          80:'https://openweathermap.org/img/wn/09d@2x.png',81:'https://openweathermap.org/img/wn/09d@2x.png',82:'https://openweathermap.org/img/wn/09d@2x.png',
          95:'https://openweathermap.org/img/wn/11d@2x.png'
        };
        const days = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
        const container = document.getElementById('weatherWeek');
        container.innerHTML = '';
        const today = new Date();
        for (let i = 0; i < dates.length; i++) {
          const d = new Date(dates[i] + 'T12:00:00');
          const el = document.createElement('div');
          const isToday = d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
          el.className = 'weather-day-item' + (isToday ? ' today' : '');
          el.innerHTML = `<img src="${icons[codes[i]] || icons[0]}" alt=""><div class="weather-day-meta"><div>${isToday ? 'Oggi' : days[d.getDay()]}</div><div>${Math.round(max[i])}°</div></div>`;
          container.appendChild(el);
        }
      } catch(e) {}
    }
    loadWeather();

    // Links management
    const defaultLinks = [
      { name: 'Sito', url: 'https://www.gabrielelombardisrl.com' },
      { name: 'Webmail', url: 'https://server703.web-hosting.com:2096/cpsess1949584074/webmail/jupiter/account_preferences/index.html#/' },
      { name: 'Namecheap', url: 'https://www.namecheap.com' },
      { name: 'Legalmail PEC', url: 'https://webmail.infocert.it/legalmail/' },
      { name: 'Namirial PEC', url: 'https://www.namirial.it/pec/' },
      { name: 'Gmail', url: 'https://mail.google.com' },
      { name: 'Fatture in cloud', url: 'https://www.fattureincloud.it' },
      { name: 'Google Drive', url: 'https://drive.google.com/drive/folders/1b-_ltrPAFRr6zDzSw6Bn8rayREw6NcQG?usp=drive_link' },
      { name: 'GitHub', url: 'https://github.com/lombardiadmin?tab=repositories' },
      { name: 'Facebook', url: 'https://www.facebook.com/gabrielelombardi.srl' },
      { name: 'Instagram', url: 'https://www.instagram.com/gabrielelombardi.srl/' }
    ];
    function getLinks() {
      try {
        const raw = localStorage.getItem('startpage-links');
        if (raw) return JSON.parse(raw);
      } catch(e) {}
      const init = defaultLinks.slice(0, 16);
      while (init.length < 16) init.push(null);
      localStorage.setItem('startpage-links', JSON.stringify(init));
      return init;
    }
    function saveLinks(links) {
      localStorage.setItem('startpage-links', JSON.stringify(links));
    }
    function linkIconSvg() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
    }
    function renderLinks() {
      const grid = document.getElementById('linksGrid');
      if (!grid) return;
      const links = getLinks();
      grid.innerHTML = '';
      links.forEach((link, i) => {
        if (link && link.url) {
          const wrap = document.createElement('div');
          wrap.className = 'link-item';
          wrap.style.position = 'relative';
          const a = document.createElement('a');
          a.href = link.url;
          a.target = '_blank';
          a.style.color = 'inherit';
          a.style.textDecoration = 'none';
          a.style.display = 'flex';
          a.style.flexDirection = 'column';
          a.style.alignItems = 'center';
          a.style.gap = '6px';
          a.innerHTML = linkIconSvg() + '<span class="link-name">' + (link.name || 'Link') + '</span>';
          const remove = document.createElement('button');
          remove.className = 'link-remove';
          remove.type = 'button';
          remove.textContent = '×';
          remove.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const ls = getLinks();
            ls[i] = null;
            saveLinks(ls);
            renderLinks();
          });
          wrap.appendChild(a);
          wrap.appendChild(remove);
          grid.appendChild(wrap);
        } else {
          const add = document.createElement('button');
          add.className = 'link-item link-add';
          add.type = 'button';
          add.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="link-name">Aggiungi</span>';
          add.addEventListener('click', () => addLinkAt(i));
          grid.appendChild(add);
        }
      });
    }
    function addLinkAt(index) {
      const name = prompt('Nome del link:');
      if (!name) return;
      let url = prompt('URL del link (includi https://):');
      if (!url) return;
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }
      const links = getLinks();
      links[index] = { name, url };
      saveLinks(links);
      renderLinks();
    }
    renderLinks();

    const notes = document.getElementById('notes');
    if (notes) {
      notes.value = localStorage.getItem('startpage-notes') || '';
      notes.addEventListener('input', () => localStorage.setItem('startpage-notes', notes.value));
    }

    // Local calendar
    let calDate = new Date();
    function renderCalendar() {
      const grid = document.getElementById('calGrid');
      const title = document.getElementById('calTitle');
      if (!grid || !title) return;
      grid.innerHTML = '';
      const year = calDate.getFullYear();
      const month = calDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const monthNames = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
      title.textContent = monthNames[month] + ' ' + year;
      let start = firstDay.getDay();
      if (start === 0) start = 7;
      for (let i = 1; i < start; i++) {
        const empty = document.createElement('div');
        empty.style.borderRight = '1px solid rgba(255,255,255,.08)';
        empty.style.borderBottom = '1px solid rgba(255,255,255,.08)';
        grid.appendChild(empty);
      }
      for (let d = 1; d <= lastDay.getDate(); d++) {
        const cellWrap = document.createElement('div');
        cellWrap.style.display = 'flex';
        cellWrap.style.flexDirection = 'column';
        cellWrap.style.minHeight = '40px';
        cellWrap.style.overflow = 'hidden';
        cellWrap.style.borderRight = '1px solid rgba(255,255,255,.08)';
        cellWrap.style.borderBottom = '1px solid rgba(255,255,255,.08)';
        const dayNum = document.createElement('div');
        dayNum.textContent = d;
        dayNum.style.padding = '2px 4px';
        dayNum.style.fontSize = '20px';
        dayNum.style.fontWeight = '600';
        const today = new Date();
        if (today.getDate() === d && today.getMonth() === month && today.getFullYear() === year) {
          cellWrap.style.background = 'rgba(246,120,40,0.3)';
          dayNum.style.fontWeight = '600';
        }
        const note = document.createElement('div');
        note.contentEditable = true;
        note.className = 'cal-note';
        note.setAttribute('data-date', year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0'));
        note.style.flex = '1';
        note.style.fontSize = '11px';
        note.style.padding = '2px 4px';
        note.style.outline = 'none';
        note.style.wordBreak = 'break-word';
        note.style.overflow = 'hidden';
        const key = 'cal-note-' + note.getAttribute('data-date');
        note.textContent = localStorage.getItem(key) || '';
        note.addEventListener('input', () => {
          if (note.textContent.length > 30) {
            note.textContent = note.textContent.substring(0, 30);
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(note);
            range.collapse(false);
            sel.removeAllRanges();
            sel.addRange(range);
          }
          localStorage.setItem(key, note.textContent);
        });
        cellWrap.appendChild(dayNum);
        cellWrap.appendChild(note);
        grid.appendChild(cellWrap);
      }
    }
    function prevMonth() { calDate.setMonth(calDate.getMonth() - 1); renderCalendar(); }
    function nextMonth() { calDate.setMonth(calDate.getMonth() + 1); renderCalendar(); }
    renderCalendar();
  </script>
</body>
</html>
