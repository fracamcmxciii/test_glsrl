<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startpage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: 'Montserrat', system-ui, sans-serif;
      background: #003566;
      color: #f5f5f5;
      overflow: hidden;
    }
    .bg-pattern {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-pattern::before {
      content: '';
      position: absolute;
      inset: -40%;
      background-image: url('https://lombardiadmin.github.io/gl_startpage/img/LOGO_ALLBLACK.svg');
      background-repeat: repeat;
      background-size: 160px 160px;
      opacity: 0.08;
      transform: rotate(-30deg);
      animation: pattern-scroll 80s linear infinite;
      filter: brightness(0);
    }
    @keyframes pattern-scroll {
      from { background-position: 0 0; }
      to { background-position: 320px 0; }
    }
    .container {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: clamp(20px, 4vw, 60px);
      height: 100dvh;
      padding: clamp(20px, 4vw, 60px);
      overflow: hidden;
    }
    .left-col, .right-col {
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 3vw, 24px);
      overflow-y: auto;
      padding-right: 8px;
    }
    .left-col::-webkit-scrollbar, .right-col::-webkit-scrollbar { width: 6px; }
    .left-col::-webkit-scrollbar-thumb, .right-col::-webkit-scrollbar-thumb { background: rgba(246,120,40,.6); border-radius: 6px; }
    .left-col::-webkit-scrollbar-track, .right-col::-webkit-scrollbar-track { background: transparent; }
    
    .title {
      font-size: clamp(42px, 10vw, 90px);
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 0.9;
    }
    
    .time-row {
      display: flex;
      align-items: center;
      gap: clamp(16px, 3vw, 28px);
      flex-wrap: nowrap;
    }
    .time {
      font-size: clamp(48px, 14vw, 140px);
      font-weight: 700;
      letter-spacing: -4px;
      line-height: 0.9;
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-shrink: 0;
    }
    .time-seconds {
      font-size: clamp(24px, 7vw, 70px);
      color: #f67828;
      font-weight: 600;
    }
    .alarm-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
      height: 72px;
      flex-shrink: 0;
    }
    .alarm-card input[type="time"] {
      background: transparent;
      border: none;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
    }
    .alarm-card button {
      background: #f67828;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
    }
    
    .weather {
      display: flex;
      gap: clamp(12px, 2vw, 16px);
      flex-wrap: nowrap;
    }
    .weather-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid rgba(246,120,40,.6);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
      height: 72px;
      width: 200px;
      flex-shrink: 0;
    }
    .weather-icon {
      width: 42px;
      height: 42px;
    }
    .weather-info {
      display: flex;
      flex-direction: column;
    }
    .weather-day {
      font-size: 12px;
      opacity: .8;
    }
    .weather-temp {
      font-size: 20px;
      font-weight: 700;
    }
    
    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 999px;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      outline: none;
    }
    .search-box button {
      background: transparent;
      border: none;
      color: #f5f5f5;
      cursor: pointer;
    }
    
    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 12px;
    }
    .link-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #f5f5f5;
      text-align: center;
    }
    .link-btn {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid rgba(246,120,40,.6);
      border-radius: 12px;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }
    .link-btn svg {
      width: 26px;
      height: 26px;
    }
    .link-item:hover .link-btn {
      border-color: #f67828;
      background: rgba(246,120,40,.25);
      transform: translateY(-2px);
    }
    .link-name {
      font-size: 11px;
      line-height: 1.2;
      max-width: 90px;
    }
    
    .notes-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 16px;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,.4);
    }
    .notes-card textarea {
      width: 100%;
      min-height: 140px;
      background: transparent;
      border: none;
      color: #f5f5f5;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      resize: vertical;
      outline: none;
    }
    
    .calendar-card {
      flex: 1;
      height: 100%;
      background: linear-gradient(145deg, rgba(0,53,102,.8), rgba(0,35,63,.5));
      border: 1px solid #f67828;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,.4);
    }
    .calendar-card iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    
    @media (max-width: 1100px) {
      .container { grid-template-columns: 1fr; overflow-y: auto; }
      html, body { overflow: auto; }
      .calendar-card { height: 400px; }
      .weather { flex-wrap: wrap; }
      .time-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="container">
    <div class="left-col">

      <div class="time-row">

      <div class="weather">

        <input type="text" name="q" placeholder="Cerca con Google..." autocomplete="off">
        <button type="submit">Cerca</button>
      </form>
      
      <div class="links-grid">
        <a class="link-item" href="https://gabrielelombardisrl.com" target="_blank">

          </div>

        </a>
        <a class="link-item" href="https://webmail.gabrielelombardisrl.com" target="_blank">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>

        </a>
        <a class="link-item" href="https://www.namecheap.com" target="_blank">
          <div class="link-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h10v10H7z"/></svg>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3 7 12 13 21 7"/></svg>
          </div>
          <span class="link-name">Legalmail PEC</span>
        </a>
        <a class="link-item" href="https://namiral.it" target="_blank">
          <div class="link-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M8 8h8v8H8z"/></svg>
          </div>
          <span class="link-name">Namiral PEC</span>
        </a>
        <a class="link-item" href="https://mail.google.com" target="_blank">
          <div class="link-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
          </div>

      <div class="notes-card">
        <div style="font-weight:600; font-size:14px;">Note</div>

    <div class="right-col">

      </div>

  <script>
    function updateTime() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('time-main').textContent = h + ':' + m;
      document.getElementById('time-sec').textContent = ':' + s;
    }
    setInterval(updateTime, 1000);
    updateTime();

    let alarmTime = null;
    let alarmTriggered = false;
    function setAlarm() {
      const val = document.getElementById('alarmTime').value;
      if (!val) return;
      alarmTime = val;
      alarmTriggered = false;
      document.getElementById('alarmStatus').textContent = 'Sveglia impostata per ' + val;
    }
    setInterval(() => {
      if (!alarmTime) return;
      const now = new Date();
      const cur = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      if (cur === alarmTime && !alarmTriggered) {
        alarmTriggered = true;
        alert('Sveglia!');
        document.getElementById('alarmStatus').textContent = 'Sveglia attivata';
      }
    }, 1000);

    async function loadWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=43.9636&longitude=10.2097&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe/Rome&forecast_days=2');
        const data = await res.json();
        const codes = data.daily.weathercode;
        const max = data.daily.temperature_2m_max;
        document.getElementById('weather-today').textContent = Math.round(max[0]) + '°';
        document.getElementById('weather-tomorrow').textContent = Math.round(max[1]) + '°';
        const icons = {
          0: 'https://openweathermap.org/img/wn/01d@2x.png',1:'https://openweathermap.org/img/wn/01d@2x.png',2:'https://openweathermap.org/img/wn/02d@2x.png',3:'https://openweathermap.org/img/wn/03d@2x.png',
          45:'https://openweathermap.org/img/wn/50d@2x.png',48:'https://openweathermap.org/img/wn/50d@2x.png',
          51:'https://openweathermap.org/img/wn/09d@2x.png',53:'https://openweathermap.org/img/wn/09d@2x.png',55:'https://openweathermap.org/img/wn/09d@2x.png',
          61:'https://openweathermap.org/img/wn/10d@2x.png',63:'https://openweathermap.org/img/wn/10d@2x.png',65:'https://openweathermap.org/img/wn/10d@2x.png',
          71:'https://openweathermap.org/img/wn/13d@2x.png',73:'https://openweathermap.org/img/wn/13d@2x.png',75:'https://openweathermap.org/img/wn/13d@2x.png',
          80:'https://openweathermap.org/img/wn/09d@2x.png',81:'https://openweathermap.org/img/wn/09d@2x.png',82:'https://openweathermap.org/img/wn/09d@2x.png',
          95:'https://openweathermap.org/img/wn/11d@2x.png'
        };
        document.getElementById('weather-icon-today').src = icons[codes[0]] || icons[0];
        document.getElementById('weather-icon-tomorrow').src = icons[codes[1]] || icons[0];
      } catch(e) {}
    }
    loadWeather();

    const notes = document.getElementById('notes');
    notes.value = localStorage.getItem('startpage-notes') || '';
    notes.addEventListener('input', () => localStorage.setItem('startpage-notes', notes.value));
  </script>
</body>
</html>
